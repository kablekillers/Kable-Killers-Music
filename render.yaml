services:
  - type: web
    name: kable-killers-music
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kable-killers-music-db
          property: connectionString

databases:
  - name: kable-killers-music-db
    plan: free
    databaseName: kkmusic
    user: kkmusic
