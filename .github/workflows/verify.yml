name: Verify Kable Killers Music
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run check
      - name: Build addon and landing page
        run: npm run build
